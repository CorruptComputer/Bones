---
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      Core:
        patterns:
          - "Aspire.Hosting.AppHost"
          - "Autofac"
          - "Autofac.*"
          - "DnsClient"
          - "FluentValidation"
          - "FluentValidation.*"
          - "GeoJSON.Text"
          - "MediatR"
          - "MediatR.*"
          - "Microsoft.*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "Npgsql.EntityFrameworkCore.PostgreSQL.Design"
          - "OpenTelemetry.*"
          - "Serilog"
          - "Serilog.*"
        exclude-patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Components.WebAssembly"
          - "Microsoft.AspNetCore.Components.WebAssembly.*"
      Frontend:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Components.WebAssembly"
          - "Microsoft.AspNetCore.Components.WebAssembly.*"
          - "MudBlazor"
          - "NSwag.ApiDescription.Client"
          - "Swashbuckle.*"
      Testing:
        patterns:
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "xunit"
          - "xunit.*"
          - "coverlet.collector"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      Pipeline:
        patterns:
          - "*"
